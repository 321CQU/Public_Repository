version: '3'
services:
  control-center:
    container_name: 321cqu-control-center
    image: ${CONTROL_CENTER_IMAGE}
    expose:
      - ${CONTROL_CENTER_EXPOSE_PORT}
    restart: always
    volumes:
      - ${CONTROL_CENTER_HOME_DIR}/config:/etc/ControlCenter:ro
    networks:
      - persist

  api-gateway:
    container_name: 321cqu-api-gateway
    image: ${API_GATEWAY_IMAGE}
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - ${API_GATEWAY_HOME_DIR}/logs:/src/logs
      - ${API_GATEWAY_HOME_DIR}/config.cfg:/src/utils/config.cfg
      - ${_321CQU_PUBLIC_REPOSITORY_PATH}/python_package:/_321CQU_package
    environment:
      PYTHONPATH: /_321CQU_package
    networks:
      - persist

  edu-admin-center:
    container_name: 321cqu-edu-admin-center
    image: ${EDU_ADMIN_CENTER_IMAGE}
    expose:
      - ${EDU_ADMIN_CENTER_EXPOSE_PORT}
      - ${EDU_ADMIN_CENTER_METRICS_PORT}
    restart: always
    volumes:
      - ${EDU_ADMIN_CENTER_HOME_DIR}/config:/src/utils/config
      - ${_321CQU_PUBLIC_REPOSITORY_PATH}/python_package:/_321CQU_package
    environment:
      PYTHONPATH: /_321CQU_package
    networks:
      - persist

  mycqu-service:
    container_name: 321cqu-mycqu-service
    image: ${MYCQU_SERVICE_IMAGE}
    expose:
      - ${MYCQU_SERVICE_EXPOSE_PORT}
      - ${MYCQU_SERVICE_METRICS_PORT}
    restart: always
    volumes:
      - ${MYCQU_SERVICE_HOME_DIR}/logs:/app/logs
      - ${MYCQU_SERVICE_HOME_DIR}/config:/app/config
      - ${_321CQU_PUBLIC_REPOSITORY_PATH}/python_package:/_321CQU_package
    environment:
      PYTHONPATH: /_321CQU_package
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_SECRET_ID: ${PROXY_SECRET_ID}
      PROXY_SIGNATURE: ${PROXY_SIGNATURE}
    networks:
      - persist

  prometheus:
    container_name: 321cqu-prometheus
    image: ${PROMETHEUS_IMAGE}
    ports:
      - "${PROMETHEUS_PORT}:9090"
    restart: always
    volumes:
      - ${_321CQU_PUBLIC_REPOSITORY_PATH}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${_321CQU_PUBLIC_REPOSITORY_PATH}/prometheus/token:/etc/prometheus/token:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    depends_on:
      - api-gateway
    networks:
      - persist

  grafana:
    container_name: 321cqu-grafana
    image: ${GRAFANA_IMAGE}
    ports:
      - "${GRAFANA_PORT}:3000"
    restart: always
    volumes:
      - grafana-data:/var/lib/grafana
      - ${_321CQU_PUBLIC_REPOSITORY_PATH}/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - persist

networks:
  persist:
    external:
      name: 321cqu

volumes:
  prometheus-data:
  grafana-data:
